name: Build & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  # amd64 image, built natively on the GitHub-hosted x86 runner.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.13.1'

      # Node 26 no longer bundles corepack, so install it explicitly. Pinning
      # 0.36.0 from npm also avoids older corepack resolving pnpm through the
      # old bin/pnpm.cjs path, which pnpm 12 no longer ships. 0.36.0 includes
      # the pnpm 11+ native-bin fix (#776) and is the version the sibling
      # rossmoney_me repository pins.
      - name: Enable Corepack
        run: npm i -g corepack@0.36.0 && corepack enable

      - name: Install frontend deps & build
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm run build

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'

      - name: Go mod download
        run: go mod download

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Push by digest only. The merge job assembles the multi-arch manifest
      # from the two per-architecture digests.
      - name: Build and push amd64 image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: Record amd64 digest
        run: |
          digest="${{ steps.build.outputs.digest }}"
          if [ -z "$digest" ]; then
            echo "No digest produced by the amd64 build" >&2
            exit 1
          fi
          printf '%s\n' "$digest" > "${RUNNER_TEMP}/digest"

      - name: Upload amd64 digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-amd64
          path: ${{ runner.temp }}/digest
          if-no-files-found: error
          retention-days: 1

  # arm64 image, built natively on the GitHub-hosted ARM runner. No QEMU is
  # needed because the runner's architecture matches the image.
  build-arm64:
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.13.1'

      # Node 26 no longer bundles corepack, so install it explicitly. Pinning
      # 0.36.0 from npm also avoids older corepack resolving pnpm through the
      # old bin/pnpm.cjs path, which pnpm 12 no longer ships. 0.36.0 includes
      # the pnpm 11+ native-bin fix (#776) and is the version the sibling
      # rossmoney_me repository pins.
      - name: Enable Corepack
        run: npm i -g corepack@0.36.0 && corepack enable

      - name: Install frontend deps & build
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm run build

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'

      - name: Go mod download
        run: go mod download

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push arm64 image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

      - name: Record arm64 digest
        run: |
          digest="${{ steps.build.outputs.digest }}"
          if [ -z "$digest" ]; then
            echo "No digest produced by the arm64 build" >&2
            exit 1
          fi
          printf '%s\n' "$digest" > "${RUNNER_TEMP}/digest"

      - name: Upload arm64 digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-arm64
          path: ${{ runner.temp }}/digest
          if-no-files-found: error
          retention-days: 1

  # Publish the multi-arch manifest from both digests. The deploy job below
  # runs only after the manifest has been pushed, so it always pulls the image
  # this run just built.
  merge:
    runs-on: ubuntu-latest
    needs: [build, build-arm64]
    steps:
      - name: Download amd64 digest
        uses: actions/download-artifact@v8
        with:
          name: digest-amd64
          path: ${{ runner.temp }}/digests/amd64

      - name: Download arm64 digest
        uses: actions/download-artifact@v8
        with:
          name: digest-arm64
          path: ${{ runner.temp }}/digests/arm64

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish multi-arch manifest
        run: |
          amd64="$(cat "${RUNNER_TEMP}/digests/amd64/digest")"
          arm64="$(cat "${RUNNER_TEMP}/digests/arm64/digest")"
          docker buildx imagetools create \
            --tag "ghcr.io/${GITHUB_REPOSITORY}:latest" \
            --tag "ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_SHA}" \
            "ghcr.io/${GITHUB_REPOSITORY}@${amd64}" \
            "ghcr.io/${GITHUB_REPOSITORY}@${arm64}"

  # Ask the fleet's deploy seat on mgmt to pull and recreate the stack from its
  # Ansible-managed files. This repository is public and the shared
  # deploy-stack.yml workflow lives in the private infrastructure-as-code
  # repository, which GitHub will not let a public repository call, so the
  # transport is duplicated here. The seat validates the host and stack itself;
  # this job only delivers the request. The seat address is a secret so no real
  # hostname is published.
  deploy:
    name: Deploy travelling-site
    needs: [merge]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: gh-travelling-site-${{ github.run_id }}

      - name: Ask the fleet deploy seat to deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SEAT_HOST: ${{ secrets.DEPLOY_SEAT_HOST }}
          TARGET_HOST: photos
          TARGET_STACKS: photos-travelling-site
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy"
          chmod 0600 "$HOME/.ssh/deploy"
          ssh -i "$HOME/.ssh/deploy" -p 32 \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            root@"$DEPLOY_SEAT_HOST" \
            "fleet-deploy $TARGET_HOST $TARGET_STACKS deploy"
