services:
  image-mosaic:
    image: ghcr.io/tekkifox/travelling-site:latest
    container_name: travelling
    hostname: travelling
    ports:
      # Do not pin a host address here. Tailnet addresses change, and nginx on
      # rossmoney reaches this site by tailnet name (photos.tail81cbd2.ts.net:8080),
      # so a pinned address that is no longer assigned leaves the container unable
      # to start: "cannot assign requested address".
      - "8080:8080"
    networks:
      proxy:
        aliases:
          - travelling-site
    env_file:
      - stack.env
    restart: unless-stopped
networks:
  proxy:
    external: true
