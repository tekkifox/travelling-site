name: Build & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  # arm64 only. The image's sole consumer is photos, which is an aarch64 host,
  # and the GitHub-hosted ARM runner has the same architecture as the image, so
  # nothing is cross-built and no QEMU is involved.
  build:
    name: Build & push arm64 image
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A mislabelled runner would still build, silently for the wrong
      # architecture, so fail loudly unless this really is native arm64.
      - name: Verify the runner is aarch64
        run: |
          arch="$(uname -m)"
          if [ "$arch" != "aarch64" ]; then
            echo "Expected a native aarch64 runner, got '${arch}'" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.13.1'

      # Node 26 no longer bundles corepack, so install it explicitly. Pinning
      # 0.36.0 from npm also avoids older corepack resolving pnpm through the
      # old bin/pnpm.cjs path, which pnpm 12 no longer ships. 0.36.0 includes
      # the pnpm 11+ native-bin fix (#776) and is the version the sibling
      # rossmoney_me repository pins.
      - name: Enable Corepack
        run: npm i -g corepack@0.36.0 && corepack enable

      - name: Install frontend deps & build
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm run build

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'

      - name: Go mod download
        run: go mod download

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The image has a single platform, so it is tagged as it is built: there
      # is no per-architecture digest left for a merge job to assemble into a
      # manifest. Only main publishes, so a workflow_dispatch on a branch is a
      # build check that cannot move :latest.
      - name: Build and push arm64 image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

  # Ask the deploy gateway on the tailnet to pull and recreate the stack from
  # its Ansible-managed files. This repository is public and the shared
  # deploy-stack.yml workflow lives in the private infrastructure-as-code
  # repository, which GitHub will not let a public repository call, so the
  # transport is duplicated here. The gateway validates the host and stack
  # itself; this job only delivers the request. It runs after the push, so the
  # deploy always pulls the image this run just built. The runner is
  # GitHub-hosted and ephemeral, so it joins the tailnet for the run, uses this
  # repository's gateway key, and pins the gateway host key instead of trusting
  # a first-use key.
  deploy:
    name: Deploy travelling-site
    needs: [build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: gh-travelling-site-${{ github.run_id }}

      - name: Install the gateway key and its pinned host key
        env:
          GATEWAY_KEY: ${{ secrets.DEPLOY_GATEWAY_SSH_KEY }}
          GATEWAY_HOST_KEY: ${{ secrets.DEPLOY_GATEWAY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$GATEWAY_KEY" > "$HOME/.ssh/gateway"
          chmod 0600 "$HOME/.ssh/gateway"
          printf '%s\n' "$GATEWAY_HOST_KEY" > "$HOME/.ssh/gateway_known_hosts"
          chmod 0600 "$HOME/.ssh/gateway_known_hosts"

      - name: Ask the deploy gateway to deploy
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gateway" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/gateway_known_hosts" \
            -o ConnectTimeout=30 \
            deploy-hop@deploy-gateway.tail81cbd2.ts.net \
            "deploy photos photos-travelling-site"
